      @keyframes pulse-gentle {
        0%,

      @keyframes leaf-fall {
        0% {
          transform: translateY(-30px) rotate(0deg) translateX(0);
          opacity: 0;

          opacity: 0.65;

        80% {

      /* Guest Card */
      .guest-card {
        position: relative;

        -webkit-backdrop-filter: blur(10px);

        content: "";

        width: 30px;
        height: 30px;
        pointer-events: none;
      }

          max-height: 100vh !important;
        }

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById(
          "ambient-particles-container",
        );

        const particleCount = 14;

        const svgs = [
          `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 2C6 7 4 14 12 22C20 14 18 7 12 2Z"
          fill="#5c8a68"
          fill-opacity="0.45"
        />
      </svg>
      `,

          `
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <circle
          cx="5"
          cy="5"
          r="4"
          fill="#d4af37"
          fill-opacity="0.55"
        />
      </svg>
      `,

          `
      <svg width="12" height="12" viewBox="0 0 24 24"
        fill="#c59b27"
        fill-opacity="0.5"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"
        />
      </svg>
      `,
        ];

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement("div");

          particle.className = "leaf-particle";

          const randomType = Math.floor(Math.random() * svgs.length);
          particle.innerHTML = svgs[randomType];

          const leftPos = Math.random() * 95;
          const duration = 7 + Math.random() * 9;
          const delay = Math.random() * 8;
          const scale = 0.6 + Math.random() * 0.7;

          particle.style.left = `${leftPos}%`;
          particle.style.top = `-20px`;
          particle.style.animation = `leaf-fall ${duration}s linear infinite`;
          particle.style.animationDelay = `${delay}s`;
          particle.style.transform = `scale(${scale})`;

          container.appendChild(particle);
        }
      });
    </script>
