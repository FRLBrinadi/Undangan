<!doctype html>

<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Undangan Aqiqah &amp; Syukuran - Muhammad Syauqi Ar-Rayyan</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              forest: {
                700: "#2d5a3c",
                800: "#1e3d29",
                900: "#142c1d",
              },
              sage: {
                100: "#eef3ef",
                200: "#dbe5dc",
                500: "#75997e",
                600: "#537d5e",
              },
              earthGold: {
                300: "#e5c875",
                400: "#d4af37",
                500: "#c59b27",
                600: "#9e791b",
              },
              parchment: "#faf8f3",
            },
            fontFamily: {
              serif: ["Playfair Display", "Georgia", "serif"],
              script: ["Great Vibes", "Allura", "cursive"],
              sans: [
                "Plus Jakarta Sans",
                "-apple-system",
                "BlinkMacSystemFont",
                "sans-serif",
              ],
              arabic: ["Amiri", "Traditional Arabic", "serif"],
            },
          },
        },
      };
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Great+Vibes&amp;family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Core Layout Styles -->
    <style data-purpose="layout">
      body {
        background-color: #111a14;
        font-family: "Plus Jakarta Sans", sans-serif;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
      }

      .screen-container {
        width: 100%;
        max-width: 440px;
        min-height: 100dvh;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.45);
        position: relative;
        overflow: hidden;
      }
    </style>
    <!-- Atmospheric & Animation Styles -->
    <style data-purpose="animations">
      @keyframes pulse-gentle {
        0%,
        100% {
          transform: scale(1);
          box-shadow:
            0 10px 25px -5px rgba(45, 90, 60, 0.4),
            0 0 0 0 rgba(212, 175, 55, 0.3);
        }
        50% {
          transform: scale(1.025);
          box-shadow:
            0 14px 28px -5px rgba(45, 90, 60, 0.5),
            0 0 0 7px rgba(212, 175, 55, 0);
        }
      }

      @keyframes leaf-fall {
        0% {
          transform: translateY(-30px) rotate(0deg) translateX(0);
          opacity: 0;
        }
        15% {
          opacity: 0.65;
        }
        80% {
          opacity: 0.7;
        }
        100% {
          transform: translateY(105vh) rotate(340deg) translateX(45px);
          opacity: 0;
        }
      }

      @keyframes spin-slow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .btn-breathe {
        animation: pulse-gentle 2.6s infinite ease-in-out;
      }

      .music-spin {
        animation: spin-slow 10s linear infinite;
      }

      .leaf-particle {
        position: absolute;
        pointer-events: none;
        z-index: 15;
      }
    </style>
  </head>
  <body
    class="flex justify-center items-center min-h-screen p-0 sm:py-6 sm:px-4 selection:bg-earthGold-300 selection:text-forest-900"
  >
    <!-- BEGIN: InvitationFrame -->
    <main
      class="screen-container bg-parchment flex flex-col justify-between text-slate-800 relative select-none"
    >
      <!-- BEGIN: BackgroundLayer -->
      <div
        class="absolute inset-0 z-0 pointer-events-none"
        data-purpose="background-artwork"
      >
        <!-- Reference illustration with watercolor eucalyptus and sweet baby lion cub -->
        <img
          alt="Eucalyptus and baby lion watercolor backdrop"
          class="w-full h-full object-cover object-center"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcOoydRwkkhexqenb3THKpUU4-Z1u_f1czgI8ndpPlBT0foDb0yZ1F-8ZjR0Zq1HdwaffFUlsijvZCnNOiGA7xW7bOFG76ihm4YPyUk7-sqd6EcDqHEsA-7hGklLHRLnmEhWXYL9ulWAOOPX2deC74d-VQqPl1Y2gfN3dhC3aIES6GYaAZep82HYL_Pu2CQ-G10JjXLtVDJgEbMcdOIqyPa14LUcb00KxX6HO7BDd8y7SX7SLGzWj7v6EsaJhZeAHB3A"
        />
        <!-- Soft translucent vignette scrim to guarantee text legibility while retaining animal & foliage visibility -->
        <div
          class="absolute inset-0 bg-gradient-to-b from-white/70 via-white/55 to-white/20 backdrop-blur-[0.5px]"
        ></div>
      </div>
      <!-- END: BackgroundLayer -->
      <!-- BEGIN: AmbientParticles -->
      <div
        aria-hidden="true"
        class="absolute inset-0 overflow-hidden pointer-events-none z-10"
        id="ambient-particles-container"
      >
        <!-- Dynamic particles rendered via JavaScript -->
      </div>
      <!-- END: AmbientParticles -->
      <!-- BEGIN: TopBar -->
      <header
        class="relative z-20 pt-6 px-5 flex items-center justify-between"
        data-purpose="navigation-and-controls"
      >
        <!-- Celebration Pill Tag -->
        <div
          class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/80 backdrop-blur-md border border-forest-700/15 shadow-sm text-[10px] tracking-[0.16em] uppercase font-semibold text-forest-700"
        >
          <span
            class="w-1.5 h-1.5 rounded-full bg-earthGold-500 animate-ping"
          ></span>
          <span>The Aqiqah &amp; Tasyakuran</span>
        </div>
      </header>
      <!-- END: TopBar -->
      <!-- BEGIN: MainContent -->
      <section
        class="relative z-20 flex-1 flex flex-col items-center justify-center px-6 pt-3 pb-2 text-center"
        data-purpose="ceremony-details"
      >
        <!-- Bismillah Typography -->
        <div class="mb-2">
          <p
            class="font-arabic text-xl sm:text-2xl text-forest-800 leading-relaxed drop-shadow-sm"
            dir="rtl"
          >
            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
          </p>
        </div>
        <!-- Ceremony Header -->
        <div class="space-y-1 mb-2">
          <span
            class="inline-block text-[11px] font-bold tracking-[0.24em] text-forest-700 uppercase"
          >
            Walimatul Aqiqah
          </span>
          <p
            class="text-[11px] sm:text-xs text-slate-600 font-normal italic tracking-wide max-w-[280px] mx-auto leading-relaxed"
          >
            Tasyakuran &amp; doa atas kelahiran putra kami:
          </p>
        </div>
        <!-- Baby Calligraphic & Full Name Section -->
        <div class="my-1.5 flex flex-col items-center">
          <!-- Prominent Script Calligraphy Name -->
          <h1
            class="font-script text-5xl sm:text-6xl text-forest-700 font-normal leading-none transform -rotate-1 drop-shadow-sm py-1"
          >
            Syauqi
          </h1>
          <!-- Full Official Name -->
          <!-- <h2
            class="mt-1 text-sm sm:text-base font-serif font-bold tracking-[0.16em] text-slate-900 uppercase"
          >
            Alkausar Prastowo
          </h2> -->
          <p
            class="font-script text-5xl sm:text-6xl text-forest-700 font-normal"
          >
            Alkausar Prastowo
          </p>

          <!-- Decorative Divider -->
          <div
            class="flex items-center gap-2 mt-2 w-32 justify-center opacity-70"
          >
            <span
              class="h-[1px] flex-1 bg-gradient-to-r from-transparent via-earthGold-500 to-transparent"
            ></span>
            <span class="text-earthGold-500 text-xs">✦</span>
            <span
              class="h-[1px] flex-1 bg-gradient-to-r from-transparent via-earthGold-500 to-transparent"
            ></span>
          </div>
        </div>
        <!-- Parents Information
        <div class="mt-2 text-slate-700">
          <p class="text-[11px] font-medium leading-relaxed">
            Putra tercinta dari pasangan:
          </p>
          <p
            class="text-[11px] sm:text-xs font-serif font-semibold text-forest-800 mt-0.5"
          >
            Bpk. Luwih Singgih Prastowo &amp; Ibu Rachindi Qory Trysia
          </p>
        </div> -->
        <!-- Recipient Guest Card -->
      </section>
      <!-- END: MainContent -->

      <!-- BEGIN: BottomActionSection -->
      <footer
        class="relative z-20 pb-7 pt-2 px-6 flex flex-col items-center gap-3"
        data-purpose="call-to-action"
      >
        <!-- Primary Open Invitation CTA Button -->
        <a
          class="btn-breathe w-full max-w-[280px] py-3.5 px-5 rounded-full bg-gradient-to-r from-forest-800 via-forest-700 to-forest-800 text-white font-semibold text-xs sm:text-sm tracking-[0.12em] flex items-center justify-center gap-2.5 shadow-lg border border-earthGold-400/40 active:brightness-95 transition-all uppercase"
          data-purpose="open-envelope-action"
          href="a.html"
          onclick="openInvitation()"
        >
          <span class="text-sm">✉</span>
          <span>Buka Undangan</span>
          <span class="text-earthGold-300 font-bold text-sm">›</span>
        </a>
      </footer>
      <!-- END: BottomActionSection -->
    </main>
    <!-- END: InvitationFrame -->
    <!-- JavaScript: Ambient Particles Generator -->
    <script data-purpose="ambient-effects">
      document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById(
          "ambient-particles-container",
        );
        const particleCount = 14;

        // Realistic soft leaves and sparkles
        const svgs = [
          // Little Eucalyptus leaf
          `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6 7 4 14 12 22C20 14 18 7 12 2Z" fill="#5c8a68" fill-opacity="0.45"/>
        </svg>`,
          // Golden sparkle dot
          `<svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="5" cy="5" r="4" fill="#d4af37" fill-opacity="0.55"/>
        </svg>`,
          // Tiny gold shimmer star
          `<svg width="12" height="12" viewBox="0 0 24 24" fill="#c59b27" fill-opacity="0.5">
          <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
        </svg>`,
        ];

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement("div");
          particle.className = "leaf-particle";

          const randomType = Math.floor(Math.random() * svgs.length);
          particle.innerHTML = svgs[randomType];

          const leftPos = Math.random() * 95;
          const duration = 7 + Math.random() * 9;
          const delay = Math.random() * 8;
          const scale = 0.6 + Math.random() * 0.7;

          particle.style.left = `${leftPos}%`;
          particle.style.top = `-20px`;
          particle.style.animation = `leaf-fall ${duration}s linear infinite`;
          particle.style.animationDelay = `${delay}s`;
          particle.style.transform = `scale(${scale})`;

          container.appendChild(particle);
        }
      });
    </script>
    <!-- JavaScript: Music Player Toggle & Recipient Parameter Parsing -->
    <script data-purpose="interaction-handlers">
      document.addEventListener("DOMContentLoaded", () => {
        // 1. URL Query Parameter Support: ?to=Nama+Tamu
        const params = new URLSearchParams(window.location.search);
        const guestNameParam = params.get("to") || params.get("u");
        if (guestNameParam) {
          const guestElement = document.getElementById(
            "guest-name-placeholder",
          );
          if (guestElement) {
            guestElement.textContent = decodeURIComponent(guestNameParam);
          }
        }

        // 2. Audio State Toggle Simulator
        const musicBtn = document.getElementById("music-toggle-btn");
        const musicIcon = document.getElementById("music-icon");
        let isPlaying = true;

        musicBtn.addEventListener("click", (e) => {
          e.preventDefault();
          isPlaying = !isPlaying;

          if (isPlaying) {
            musicIcon.classList.add("music-spin");
            musicBtn.classList.remove("opacity-50");
          } else {
            musicIcon.classList.remove("music-spin");
            musicBtn.classList.add("opacity-50");
          }
        });
      });
    </script>
    <script>
      function openInvitation() {
        // Simpan status ke memori browser bahwa musik harus diputar di halaman selanjutnya
        localStorage.setItem("playMusic", "true");

        // Langsung pindah ke halaman a.html
        window.location.href = "a.html";
      }
    </script>
  </body>
</html>
